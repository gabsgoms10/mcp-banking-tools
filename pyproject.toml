[project]
name = "mcp-banking-tools"
version = "0.1.0"
description = "FastMCP Python Server providing deterministic banking tools connected to PostgreSQL."
authors = [{ name = "Gabriel Gomes" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "fastmcp>=0.4.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
